<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' gdb: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" />
  <title>Game Development Board</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <img src="icon.png" alt="" class="brand-icon" />
        <div class="brand-text">
          <div class="brand-name">Game Dev Board</div>
          <div class="brand-sub" id="dataRootLabel" title="Data folder">—</div>
        </div>
        <button class="icon-btn theme-toggle" id="themeBtn" title="Toggle dark mode">
          <svg class="sun" viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9L13 13M3 13l1.1-1.1M11.9 4.1L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <svg class="moon" viewBox="0 0 16 16" width="15" height="15"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="sidebar-section-head">
        <span>Games</span>
        <button class="icon-btn" id="newGameBtn" title="New game">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <nav id="gameTree" class="tree"></nav>

      <div class="sidebar-footer">
        <button class="footer-row" id="mcpBtn" title="Connect Claude to this app">
          <span class="dot" id="mcpDot"></span>
          <span class="footer-label" id="mcpLabel">MCP starting…</span>
          <span class="footer-action">Connect Claude</span>
        </button>
        <button class="footer-row" id="dataFolderBtn" title="Open or change the data folder">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 4.5v8a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H8L6.5 3.5h-4a1 1 0 0 0-1 1z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span class="footer-label">Data folder</span>
        </button>
        <div class="update-box">
          <button class="btn btn-block" id="updateBtn">
            <span id="updateBtnLabel">Check for updates</span>
            <span class="badge-dot hidden" id="updateBadge"></span>
          </button>
          <div class="progress hidden" id="updateProgress"><div class="progress-bar" id="updateProgressBar"></div></div>
          <div class="update-status" id="updateStatus"></div>
          <div class="version" id="versionLabel">v—</div>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="toolbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="toolbar-group" id="formatBar">
          <select id="fontFamily" title="Font">
            <option value="">Default</option>
            <option value="Segoe UI">Segoe UI</option>
            <option value="Arial">Arial</option>
            <option value="Verdana">Verdana</option>
            <option value="Tahoma">Tahoma</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
            <option value="Georgia">Georgia</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="Consolas">Consolas</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Impact">Impact</option>
          </select>
          <select id="fontSize" title="Font size">
            <option>10</option><option>12</option><option>14</option><option>16</option><option selected>18</option>
            <option>20</option><option>24</option><option>28</option><option>32</option><option>40</option>
            <option>48</option><option>64</option><option>80</option><option>96</option>
          </select>
          <span class="sep"></span>
          <button class="tb-btn" data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button class="tb-btn" data-fmt="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button class="tb-btn" data-fmt="underline" title="Underline (Ctrl+U)"><u>U</u></button>
          <button class="tb-btn" data-fmt="strike" title="Strikethrough"><s>S</s></button>
          <span class="sep"></span>
          <label class="tb-color" title="Text color">
            <span class="tb-color-a">A</span>
            <span class="tb-color-swatch" id="colorSwatch"></span>
            <input type="color" id="textColor" value="#2d2a26" />
          </label>
          <div class="swatches" id="noteSwatches" title="Note background"></div>
          <span class="sep"></span>
          <button class="tb-btn" data-fmt="align" data-value="left" title="Align left">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <button class="tb-btn" data-fmt="align" data-value="center" title="Align center">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
          <button class="tb-btn" data-fmt="list" title="Bullet list">
            <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3" cy="4" r="1.2" fill="currentColor"/><circle cx="3" cy="8" r="1.2" fill="currentColor"/><circle cx="3" cy="12" r="1.2" fill="currentColor"/><path d="M6 4h8M6 8h8M6 12h8" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
        <div class="toolbar-group right">
          <button class="tb-btn" id="addTextBtn" title="Add text (or just click the canvas)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 3h10M8 3v10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button class="tb-btn" id="addImageBtn" title="Add image from file">
            <svg viewBox="0 0 16 16" width="15" height="15"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><circle cx="5.5" cy="6" r="1.3" fill="currentColor"/><path d="M2 12l4-4 3 3 2-2 3 3" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          </button>
          <span class="sep"></span>
          <button class="tb-btn" id="zoomOutBtn" title="Zoom out (Ctrl -)">−</button>
          <button class="tb-btn zoom-label" id="zoomLabel" title="Reset zoom (Ctrl+0)">100%</button>
          <button class="tb-btn" id="zoomInBtn" title="Zoom in (Ctrl +)">+</button>
          <button class="tb-btn" id="fitBtn" title="Fit to content (Ctrl+1)">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
        </div>
      </header>

      <div id="drawbar">
        <div class="toolbar-group" id="toolGroup">
          <button class="tb-btn tool on" data-tool="select" title="Select / move (V)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 2l9.5 6.2-4.3.9 2.4 4.4-1.6.9-2.4-4.4L3.3 12.6z" fill="currentColor"/></svg>
          </button>
          <span class="sep"></span>
          <button class="tb-btn tool" data-tool="pen" title="Free draw (P)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 14c1.5-.3 2.4-1 3-2.2l7.6-7.6a1.4 1.4 0 0 0-2-2L3 9.8C1.8 10.4 1.4 11.6 2 14z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="highlighter" title="Highlighter (H)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M5 11l-2.5 2.5h4L7 13M5 11l1.5-5.5L11 2l3 3-3.5 4.5L5 11z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/><path d="M8.5 13.5h6" stroke="currentColor" stroke-width="2.4" opacity=".45"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="line" title="Straight line (L) · Shift snaps to 45°">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 13L13 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="arrow" title="Arrow (A) · Shift snaps to 45°">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 13L12.5 3.5M7 3h6v6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="rect" title="Rectangle (R) · Shift for square">
            <svg viewBox="0 0 16 16" width="15" height="15"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="ellipse" title="Ellipse (O) · Shift for circle">
            <svg viewBox="0 0 16 16" width="15" height="15"><ellipse cx="8" cy="8" rx="6" ry="4.6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </button>
          <button class="tb-btn tool" data-tool="eraser" title="Eraser: drag over drawings to remove them (E)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M6 13.5h8M2.8 9.6l6-6a1.5 1.5 0 0 1 2.1 0l2.2 2.2a1.5 1.5 0 0 1 0 2.1L8.4 12.6a3 3 0 0 1-4.2 0l-1.4-1.4a1.1 1.1 0 0 1 0-1.6zM5.5 7l4.2 4.2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="sep"></span>
        <div class="toolbar-group" id="strokeColors" title="Stroke color"></div>
        <label class="tb-color" title="Custom stroke color">
          <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" opacity=".5"/></svg>
          <input type="color" id="strokeCustom" value="#e03131" />
        </label>
        <span class="sep"></span>
        <div class="toolbar-group" id="strokeWidths">
          <button class="tb-btn width" data-width="2" title="Thin"><span class="wdot" style="width:4px;height:4px"></span></button>
          <button class="tb-btn width on" data-width="4" title="Medium"><span class="wdot" style="width:7px;height:7px"></span></button>
          <button class="tb-btn width" data-width="8" title="Thick"><span class="wdot" style="width:11px;height:11px"></span></button>
          <button class="tb-btn width" data-width="14" title="Extra thick"><span class="wdot" style="width:15px;height:15px"></span></button>
        </div>
        <span class="sep"></span>
        <button class="tb-btn" id="dashBtn" title="Dashed stroke">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 8h3M7 8h2.5M11.5 8H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="draw-hint" id="drawHint"></span>
      </div>

      <div id="canvasWrap" tabindex="-1">
        <div id="world"></div>
        <div id="emptyState" class="empty-state"></div>
        <div id="statusBar">
          <span id="saveState">Saved</span>
          <span class="status-hint">Click to type · Ctrl+V to paste · Drag empty space to pan · Ctrl+Scroll to zoom</span>
        </div>
      </div>
    </main>
  </div>

  <div id="contextMenu" class="context-menu hidden"></div>
  <div id="modalRoot"></div>
  <div id="toasts"></div>

  <script src="ui.js"></script>
  <script src="board.js"></script>
  <script src="app.js"></script>
</body>
</html>
